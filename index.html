<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Flolossary</title>
<meta name="description" content="A growing Polaroid dictionary of the words Flolosii says." />
<meta name="theme-color" content="#f2a6bf" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Flolossary" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #6b5560;
    --mute: #b09aa5;
    --blush: #ffd6e3;
    --blush-deep: #f2a6bf;
    --blush-text: #d6688f;
    --lav: #e8def7;
    --gold: #f0cf8a;
    --mint: #cdeedd;
    --mint-text: #3f8f6b;
    --line: #f3dde6;
    --paper: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      repeating-linear-gradient(115deg, rgba(242,166,191,0.05) 0 2px, transparent 2px 34px),
      repeating-linear-gradient(25deg, rgba(232,222,247,0.05) 0 2px, transparent 2px 34px),
      #ffffff;
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; position: relative; }
  header { padding-top: 40px; padding-bottom: 18px; position: relative; }
  .sparkle {
    position: absolute; pointer-events: none; opacity: 0.55;
    animation: float 5s ease-in-out infinite;
  }
  .sparkle:nth-child(1) { top: -6px; right: 46px; animation-delay: 0s; }
  .sparkle:nth-child(2) { top: 30px; right: 8px; animation-delay: 1.4s; }
  .sparkle:nth-child(3) { top: 58px; right: 78px; animation-delay: 2.6s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(8deg); }
  }
  .title-row { display: flex; align-items: center; gap: 10px; }
  h1#title {
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 2.7rem);
    margin: 0;
    line-height: 1.1;
    cursor: text;
    outline: none;
    border-bottom: 2px dashed transparent;
    color: var(--ink);
  }
  h1#title:focus { border-bottom: 2px dashed var(--blush-deep); }
  #subtitle { color: var(--mute); font-size: 0.88rem; margin-top: 8px; font-weight: 500; }
  .toolbar { display: flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1 1 160px; }
  .search-box svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--blush-deep); }
  #search {
    width: 100%; padding: 11px 12px 11px 36px; background: #fff8fa;
    border: 1.5px solid var(--line); border-radius: 999px; font-family: 'Quicksand', sans-serif;
    font-size: 0.88rem; font-weight: 500; color: var(--ink); outline: none;
  }
  #search:focus { border-color: var(--blush-deep); }
  .btn {
    display: flex; align-items: center; gap: 6px; padding: 10px 18px;
    border-radius: 999px; cursor: pointer; font-family: 'Quicksand', sans-serif;
    font-size: 0.86rem; font-weight: 700; white-space: nowrap; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 14px -8px rgba(242,166,191,0.6); }
  .btn-accent { background: var(--blush-deep); color: #fff; border: none; }
  .btn-accent:hover { box-shadow: 0 8px 18px -8px rgba(214,104,143,0.55); }
  #error-msg { color: var(--blush-text); font-size: 0.78rem; margin-top: 8px; font-weight: 600; }

  main { padding: 16px 0 60px; }
  #empty-state {
    border: 2px dashed var(--line); border-radius: 22px; padding: 50px 20px;
    text-align: center; color: var(--mute); font-size: 0.92rem; font-weight: 500;
    background: #fffafc;
  }
  #grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 26px 22px;
  }
  .polaroid-btn { background: none; border: none; padding: 0; cursor: pointer; text-align: left; width: 100%; }
  .polaroid {
    background: var(--paper); border: 1.5px solid var(--line); border-radius: 20px;
    padding: 10px 10px 14px; box-shadow: 0 2px 0 rgba(242,166,191,0.12), 0 14px 24px -16px rgba(214,104,143,0.45);
    display: flex; flex-direction: column; gap: 8px; position: relative;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .polaroid-btn:hover .polaroid { transform: translateY(-3px); box-shadow: 0 2px 0 rgba(242,166,191,0.16), 0 18px 30px -16px rgba(214,104,143,0.55); }
  .polaroid.big { padding: 18px 18px 22px; gap: 14px; transform: none !important; }
  .bow {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%) rotate(var(--bow-tilt, 0deg));
    width: 34px; height: 22px; z-index: 2; filter: drop-shadow(0 2px 3px rgba(214,104,143,0.25));
  }
  .polaroid.big .bow { width: 44px; height: 28px; top: -16px; }
  .photo {
    width: 100%; aspect-ratio: 1/1; background: linear-gradient(160deg, #fff5f8, #fdeef3) no-repeat center/cover;
    border-radius: 14px; display: flex; align-items: center; justify-content: center; color: var(--blush-deep);
  }
  .caption { text-align: center; padding: 0 2px; }
  .caption .word { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1.3rem; line-height: 1.15; color: var(--ink); }
  .caption .meaning-preview {
    font-size: 0.76rem; color: var(--mute); margin: 3px 0 0; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(107,85,96,.35); display: none;
    align-items: center; justify-content: center; padding: 16px; z-index: 50;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fffdfd; border-radius: 26px; max-width: 400px; width: 100%;
    max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 60px -20px rgba(214,104,143,.35);
    position: relative; padding: 26px 22px 26px; border: 1.5px solid var(--line);
  }
  .modal.wide { max-width: 520px; }
  .modal-close {
    position: absolute; top: 12px; right: 12px; background: var(--paper); border: 1.5px solid var(--line);
    cursor: pointer; color: var(--mute); padding: 6px; z-index: 1; border-radius: 999px;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
  }
  .modal h2.word-title {
    font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 2rem; text-align: center; margin: 18px 0 0; color: var(--ink);
  }
  .phonetic { font-size: 0.8rem; color: var(--blush-text); text-align: center; margin: 3px 0 0; font-weight: 600; }
  .divider { border-top: 2px dashed var(--line); margin: 16px 0; }
  .meaning-full { font-size: 0.96rem; line-height: 1.65; white-space: pre-wrap; font-weight: 500; }
  .example {
    font-style: italic; font-size: 0.87rem; color: var(--mute); margin-top: 10px; font-weight: 500;
    padding-left: 12px; border-left: 3px solid var(--blush);
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .modal-actions .btn { flex: 1; justify-content: center; border-radius: 999px; }
  .btn-delete { border: 1.5px solid var(--blush-deep); color: var(--blush-text); background: #fff; }
  .btn-delete.confirm { background: var(--blush-deep); color: #fff; }

  label.field-label {
    font-size: 0.74rem; font-weight: 700; color: var(--blush-text); display: block; margin-bottom: 6px;
  }
  .field { margin-bottom: 14px; }
  input[type=text], textarea {
    width: 100%; background: #fff8fa; border: 1.5px solid var(--line); border-radius: 14px;
    padding: 11px 12px; font-family: 'Quicksand', sans-serif; font-size: 0.92rem; font-weight: 500;
    color: var(--ink); outline: none;
  }
  input[type=text]:focus, textarea:focus { border-color: var(--blush-deep); }
  textarea { min-height: 70px; resize: vertical; }
  #photo-drop {
    width: 100%; max-width: 220px; margin: 0 auto; aspect-ratio: 1/1; border-radius: 22px;
    border: 2px dashed var(--line); background: #fff8fa; display: flex; align-items: center;
    justify-content: center; cursor: pointer; color: var(--blush-deep); flex-direction: column; gap: 6px;
    font-size: 0.78rem; font-weight: 600; background-size: cover; background-position: center;
  }
  #photo-drop span { font-family: 'Quicksand', sans-serif; }
  #save-btn {
    margin-top: 8px; width: 100%; padding: 13px 0; background: var(--blush-deep); color: #fff;
    border: none; border-radius: 999px; cursor: pointer; font-size: 0.9rem; font-weight: 700;
    font-family: 'Quicksand', sans-serif;
  }
  #save-btn:disabled { background: var(--line); color: var(--mute); cursor: not-allowed; }

  /* quiz */
  .quiz-center { text-align: center; }
  .quiz-h { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1.9rem; margin: 8px 0 0; color: var(--ink); }
  .quiz-sub { font-size: 0.9rem; color: var(--mute); margin-top: 10px; font-weight: 500; }
  .length-pills { display: flex; justify-content: center; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
  .pill {
    padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff;
    color: var(--ink); font-size: 0.84rem; font-weight: 700; cursor: pointer; font-family: 'Quicksand', sans-serif;
  }
  .pill.active { border-color: var(--blush-deep); background: var(--blush-deep); color: #fff; }
  #quiz-start {
    margin-top: 22px; padding: 13px 30px; background: var(--blush-deep); color: #fff; border: none;
    border-radius: 999px; cursor: pointer; font-size: 0.92rem; font-weight: 700; font-family: 'Quicksand', sans-serif;
  }
  .q-progress { font-size: 0.74rem; color: var(--blush-text); text-align: center; margin: 0 0 14px; font-weight: 700; letter-spacing: .03em; }
  .q-photo-wrap { max-width: 200px; margin: 0 auto; }
  .q-word { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1.75rem; text-align: center; margin: 16px 0 18px; color: var(--ink); }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .option {
    text-align: left; padding: 13px 15px; border-radius: 16px; border: 1.5px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; font-size: 0.88rem; font-weight: 500; display: flex;
    justify-content: space-between; align-items: center; gap: 10px; font-family: 'Quicksand', sans-serif;
  }
  .option.correct { background: var(--mint); border-color: #9ed4bb; color: var(--mint-text); }
  .option.wrong { background: #ffe3ea; border-color: var(--blush-deep); color: var(--blush-text); }
  #next-q {
    margin-top: 18px; width: 100%; padding: 12px 0; background: var(--ink); color: #fff; border: none;
    border-radius: 999px; cursor: pointer; font-size: 0.87rem; font-weight: 700; display: flex;
    align-items: center; justify-content: center; gap: 6px; font-family: 'Quicksand', sans-serif;
  }
  .score-h { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 2.1rem; margin: 0; color: var(--ink); }
  .missed-block { text-align: left; margin-top: 20px; border-top: 2px dashed var(--line); padding-top: 14px; }
  .missed-label { font-size: 0.74rem; font-weight: 700; color: var(--blush-text); margin-bottom: 8px; }
  .missed-word { font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 1.1rem; color: var(--ink); }
  .missed-meaning { font-size: 0.83rem; color: var(--mute); margin: 1px 0 0; font-weight: 500; }
  .done-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: center; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading { display: flex; justify-content: center; padding: 60px 0; color: var(--blush-deep); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="sparkle" width="16" height="16" viewBox="0 0 24 24" fill="#f0cf8a"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 24l-2.2-8.8L1 12l8.8-2.2L12 0z"/></svg>
    <svg class="sparkle" width="10" height="10" viewBox="0 0 24 24" fill="#f2a6bf"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 24l-2.2-8.8L1 12l8.8-2.2L12 0z"/></svg>
    <svg class="sparkle" width="12" height="12" viewBox="0 0 24 24" fill="#e8def7"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 24l-2.2-8.8L1 12l8.8-2.2L12 0z"/></svg>
    <div class="title-row">
      <svg width="26" height="18" viewBox="0 0 40 26" style="flex-shrink:0;">
        <path d="M20 11c-2-6-9-9-14-6-4 2.5-4 8 0 10.5C9 17 20 11 20 11z" fill="#f2a6bf"/>
        <path d="M20 11c2-6 9-9 14-6 4 2.5 4 8 0 10.5C31 17 20 11 20 11z" fill="#ffd6e3"/>
        <circle cx="20" cy="11" r="3.4" fill="#d6688f"/>
      </svg>
      <h1 id="title" contenteditable="true" spellcheck="false" title="Click to rename">Flolossary</h1>
    </div>
    <p id="subtitle">0 words collected, one ribbon-tied Polaroid at a time.</p>

    <div class="toolbar">
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Search Flolosii's words…" />
      </div>
      <button class="btn" id="quiz-btn">Quiz me</button>
      <button class="btn btn-accent" id="add-btn">+ Add word</button>
    </div>
    <p id="error-msg" style="display:none;"></p>
  </header>

  <main>
    <div id="loading"><span class="spin">◐</span></div>
    <div id="empty-state" style="display:none;"></div>
    <div id="grid" style="display:none;"></div>
  </main>
</div>

<!-- Detail modal -->
<div class="modal-overlay" id="detail-overlay">
  <div class="modal" id="detail-modal">
    <button class="modal-close" data-close>✕</button>
    <div id="detail-body"></div>
  </div>
</div>

<!-- Form modal -->
<div class="modal-overlay" id="form-overlay">
  <div class="modal" id="form-modal">
    <button class="modal-close" data-close>✕</button>
    <h3 class="quiz-h" id="form-title" style="text-align:left;font-size:1.6rem;">Add a new word</h3>
    <div style="margin-top:16px;">
      <div class="field">
        <label class="field-label">Photo</label>
        <div id="photo-drop"></div>
        <input type="file" id="photo-input" accept="image/*" style="display:none;" />
      </div>
      <div class="field">
        <label class="field-label">Word or phrase</label>
        <input type="text" id="f-word" placeholder="e.g. hangry-nap" />
      </div>
      <div class="field">
        <label class="field-label">How Flolosii says it (optional)</label>
        <input type="text" id="f-phonetic" placeholder="e.g. HANG-gree nap" />
      </div>
      <div class="field">
        <label class="field-label">What it really means</label>
        <textarea id="f-meaning" placeholder="Define it the way Flolosii would define it"></textarea>
      </div>
      <div class="field">
        <label class="field-label">Used in a sentence (optional)</label>
        <input type="text" id="f-example" placeholder="e.g. I need a hangry-nap immediately." />
      </div>
    </div>
    <button id="save-btn" disabled>Add to the collection</button>
  </div>
</div>

<!-- Quiz modal -->
<div class="modal-overlay" id="quiz-overlay">
  <div class="modal wide" id="quiz-modal">
    <button class="modal-close" data-close>✕</button>
    <div id="quiz-body"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, onSnapshot, setDoc, addDoc, updateDoc,
  deleteDoc, serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====================================================================
   1) REPLACE THIS with your own Firebase project config.
      Firebase console → Project settings → General → "Your apps" → SDK setup.
   ==================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBBFA1wtP7t1ElUO4plQSEl47EZuO6zQLk",
  authDomain: "flolossary.firebaseapp.com",
  projectId: "flolossary",
  storageBucket: "flolossary.firebasestorage.app",
  messagingSenderId: "637214840708",
  appId: "1:637214840708:web:8dccdde4946af538332fd1",
  measurementId: "G-9LBMKY1GWZ",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const entriesCol = collection(db, "entries");
const metaDoc = doc(db, "meta", "title");

/* ---------------- state ---------------- */
let entries = [];
let query_ = "";
let activeEntry = null;
let editingEntry = null;
let photoData = null;

/* ---------------- helpers ---------------- */
function uidTilt(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 1000;
  return (h % 700) / 100 - 3.5;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function compressImage(file, maxW = 700, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function esc(s) {
  const d = document.createElement("div");
  d.textContent = s ?? "";
  return d.innerHTML;
}

const CAMERA_ICON = `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8.5a1.5 1.5 0 0 1 1.5-1.5h2l1-2h7l1 2h2A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9z"/><circle cx="12" cy="13" r="3.4"/></svg>`;
function bowSVG(tilt, big) {
  const w = big ? 44 : 34, h = big ? 28 : 22;
  return `<svg class="bow" style="--bow-tilt:${tilt}deg" width="${w}" height="${h}" viewBox="0 0 40 26">
    <path d="M20 11c-2-6-9-9-14-6-4 2.5-4 8 0 10.5C9 17 20 11 20 11z" fill="#f2a6bf"/>
    <path d="M20 11c2-6 9-9 14-6 4 2.5 4 8 0 10.5C31 17 20 11 20 11z" fill="#ffd6e3"/>
    <circle cx="20" cy="11" r="3.4" fill="#d6688f"/>
  </svg>`;
}

/* ---------------- Firestore sync ---------------- */
const loadingEl = document.getElementById("loading");
const emptyEl = document.getElementById("empty-state");
const gridEl = document.getElementById("grid");
const errorEl = document.getElementById("error-msg");
const subtitleEl = document.getElementById("subtitle");
const titleEl = document.getElementById("title");

function showError(msg) {
  errorEl.style.display = "block";
  errorEl.textContent = msg;
}

try {
  const q = query(entriesCol, orderBy("createdAt", "asc"));
  onSnapshot(
    q,
    (snap) => {
      entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      loadingEl.style.display = "none";
      render();
    },
    (err) => {
      loadingEl.style.display = "none";
      showError("Couldn't connect to Firebase — check your config and Firestore rules.");
      console.error(err);
    }
  );
} catch (err) {
  loadingEl.style.display = "none";
  showError("Firebase isn't configured yet — edit firebaseConfig in index.html.");
  console.error(err);
}

onSnapshot(metaDoc, (snap) => {
  if (snap.exists() && snap.data().title) {
    titleEl.textContent = snap.data().title;
  }
}, () => {});

titleEl.addEventListener("blur", async () => {
  const t = titleEl.textContent.trim() || "Flolossary";
  titleEl.textContent = t;
  try {
    await setDoc(metaDoc, { title: t });
  } catch (err) {
    showError("Couldn't save the title.");
  }
});
titleEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); titleEl.blur(); }
});

/* ---------------- render grid ---------------- */
function render() {
  const q = query_.toLowerCase();
  const filtered = entries.filter(
    (e) => e.word.toLowerCase().includes(q) || e.meaning.toLowerCase().includes(q)
  );
  subtitleEl.textContent = `${entries.length} ${entries.length === 1 ? "word" : "words"} collected, one Polaroid at a time.`;

  if (filtered.length === 0) {
    gridEl.style.display = "none";
    emptyEl.style.display = "block";
    emptyEl.textContent = entries.length === 0
      ? "No words yet 🎀 tie a ribbon around the first one Flolosii has made her own."
      : "Nothing matches that search.";
    return;
  }
  emptyEl.style.display = "none";
  gridEl.style.display = "grid";
  gridEl.innerHTML = filtered.map(cardHTML).join("");
  filtered.forEach((entry) => {
    document.getElementById("card-" + entry.id).addEventListener("click", () => openDetail(entry));
  });
}

function cardHTML(entry) {
  const tilt = uidTilt(entry.id);
  const photoStyle = entry.image ? `background-image:url(${entry.image})` : "";
  return `
    <button class="polaroid-btn" id="card-${entry.id}">
      <div class="polaroid" style="transform:rotate(${tilt}deg)">
        ${bowSVG(tilt * 1.4)}
        <div class="photo" style="${photoStyle}">${entry.image ? "" : CAMERA_ICON}</div>
        <div class="caption">
          <div class="word">${esc(entry.word)}</div>
          <p class="meaning-preview">${esc(entry.meaning)}</p>
        </div>
      </div>
    </button>`;
}

/* ---------------- detail modal ---------------- */
const detailOverlay = document.getElementById("detail-overlay");
const detailBody = document.getElementById("detail-body");

function openDetail(entry) {
  activeEntry = entry;
  let confirmDelete = false;
  renderDetail();
  detailOverlay.classList.add("open");

  function renderDetail() {
    detailBody.innerHTML = `
      <div class="polaroid big">
        ${bowSVG(uidTilt(entry.id) * 1.4, true)}
        <div class="photo" style="${entry.image ? `background-image:url(${entry.image})` : ""}">${entry.image ? "" : CAMERA_ICON}</div>
      </div>
      <h2 class="word-title">${esc(entry.word)}</h2>
      ${entry.phonetic ? `<p class="phonetic">${esc(entry.phonetic)}</p>` : ""}
      <div class="divider"></div>
      <p class="meaning-full">${esc(entry.meaning)}</p>
      ${entry.example ? `<p class="example">"${esc(entry.example)}"</p>` : ""}
      <div class="modal-actions">
        <button class="btn" id="edit-btn">✏️ Edit</button>
        <button class="btn btn-delete ${confirmDelete ? "confirm" : ""}" id="del-btn">🗑 ${confirmDelete ? "Confirm delete" : "Delete"}</button>
      </div>`;
    document.getElementById("edit-btn").addEventListener("click", () => {
      detailOverlay.classList.remove("open");
      openForm(entry);
    });
    document.getElementById("del-btn").addEventListener("click", async () => {
      if (!confirmDelete) { confirmDelete = true; renderDetail(); return; }
      try {
        await deleteDoc(doc(db, "entries", entry.id));
        detailOverlay.classList.remove("open");
      } catch (err) {
        showError("Couldn't delete that word.");
      }
    });
  }
}

/* ---------------- form modal ---------------- */
const formOverlay = document.getElementById("form-overlay");
const formTitle = document.getElementById("form-title");
const fWord = document.getElementById("f-word");
const fPhonetic = document.getElementById("f-phonetic");
const fMeaning = document.getElementById("f-meaning");
const fExample = document.getElementById("f-example");
const photoDrop = document.getElementById("photo-drop");
const photoInput = document.getElementById("photo-input");
const saveBtn = document.getElementById("save-btn");

function openForm(entry) {
  editingEntry = entry || null;
  photoData = entry?.image || null;
  formTitle.textContent = entry ? "Edit word" : "Add a new word";
  fWord.value = entry?.word || "";
  fPhonetic.value = entry?.phonetic || "";
  fMeaning.value = entry?.meaning || "";
  fExample.value = entry?.example || "";
  updatePhotoDrop();
  saveBtn.textContent = entry ? "Save changes" : "Add to the collection";
  validateForm();
  formOverlay.classList.add("open");
}
function updatePhotoDrop() {
  if (photoData) {
    photoDrop.style.backgroundImage = `url(${photoData})`;
    photoDrop.innerHTML = "";
  } else {
    photoDrop.style.backgroundImage = "";
    photoDrop.innerHTML = `${CAMERA_ICON}<span>Add a photo</span>`;
  }
}
updatePhotoDrop();
photoDrop.addEventListener("click", () => photoInput.click());
photoInput.addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  photoDrop.textContent = "…";
  try {
    photoData = await compressImage(file);
    updatePhotoDrop();
  } catch {
    showError("Couldn't read that photo.");
  }
});
[fWord, fMeaning].forEach((el) => el.addEventListener("input", validateForm));
function validateForm() {
  saveBtn.disabled = !(fWord.value.trim() && fMeaning.value.trim());
}

document.getElementById("add-btn").addEventListener("click", () => openForm(null));

saveBtn.addEventListener("click", async () => {
  const payload = {
    word: fWord.value.trim(),
    phonetic: fPhonetic.value.trim(),
    meaning: fMeaning.value.trim(),
    example: fExample.value.trim(),
    image: photoData || null,
  };
  try {
    if (editingEntry) {
      await updateDoc(doc(db, "entries", editingEntry.id), payload);
    } else {
      await addDoc(entriesCol, { ...payload, createdAt: serverTimestamp() });
    }
    formOverlay.classList.remove("open");
  } catch (err) {
    showError("Couldn't save — check your Firestore rules/config.");
    console.error(err);
  }
});

/* ---------------- search ---------------- */
document.getElementById("search").addEventListener("input", (e) => {
  query_ = e.target.value;
  render();
});

/* ---------------- close modals ---------------- */
document.querySelectorAll("[data-close]").forEach((btn) => {
  btn.addEventListener("click", () => {
    btn.closest(".modal-overlay").classList.remove("open");
  });
});
document.querySelectorAll(".modal-overlay").forEach((ov) => {
  ov.addEventListener("click", (e) => {
    if (e.target === ov) ov.classList.remove("open");
  });
});

/* ---------------- quiz ---------------- */
const quizOverlay = document.getElementById("quiz-overlay");
const quizBody = document.getElementById("quiz-body");
document.getElementById("quiz-btn").addEventListener("click", () => {
  quizOverlay.classList.add("open");
  renderQuizIntro();
});

function buildQuiz(len) {
  const pool = shuffle(entries).slice(0, len);
  return pool.map((entry) => {
    const others = shuffle(entries.filter((e) => e.id !== entry.id)).slice(0, 3);
    const options = shuffle([entry, ...others]);
    return { entry, options };
  });
}

function renderQuizIntro() {
  const canQuiz = entries.length >= 2;
  let length = Math.min(10, entries.length);
  const lengths = [5, 10, entries.length].filter((n, i, arr) => n > 0 && n <= entries.length && arr.indexOf(n) === i);

  quizBody.innerHTML = `
    <div class="quiz-center">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="#f0cf8a"><path d="M12 0l2.2 8.8L23 12l-8.8 2.2L12 24l-2.2-8.8L1 12l8.8-2.2L12 0z"/></svg>
      <h2 class="quiz-h">Do you really know Flolosii's words?</h2>
      ${!canQuiz
        ? `<p class="quiz-sub">Add at least 2 words to the collection before you can take a quiz.</p>`
        : `<p class="quiz-sub">You'll see a word — pick what it actually means.</p>
           <div class="length-pills">${lengths.map((n) => `<button class="pill ${n === length ? "active" : ""}" data-len="${n}">${n} words</button>`).join("")}</div>
           <button id="quiz-start">Start quiz</button>`
      }
    </div>`;
  if (!canQuiz) return;

  quizBody.querySelectorAll(".pill").forEach((p) => {
    p.addEventListener("click", () => {
      length = parseInt(p.dataset.len, 10);
      quizBody.querySelectorAll(".pill").forEach((x) => x.classList.remove("active"));
      p.classList.add("active");
    });
  });
  document.getElementById("quiz-start").addEventListener("click", () => runQuiz(length));
}

function runQuiz(length) {
  const questions = buildQuiz(length);
  let qIndex = 0, score = 0, selected = null;
  const missed = [];

  function renderQuestion() {
    const q = questions[qIndex];
    const tilt = 0;
    quizBody.innerHTML = `
      <p class="q-progress">QUESTION ${qIndex + 1} OF ${questions.length}</p>
      <div class="q-photo-wrap">
        <div class="polaroid big">
          ${bowSVG(uidTilt(q.entry.id) * 1.4, true)}
          <div class="photo" style="${q.entry.image ? `background-image:url(${q.entry.image})` : ""}">${q.entry.image ? "" : CAMERA_ICON}</div>
        </div>
      </div>
      <h3 class="q-word">${esc(q.entry.word)}</h3>
      <div class="options">
        ${q.options.map((opt) => `<button class="option" data-id="${opt.id}">${esc(opt.meaning)}</button>`).join("")}
      </div>
      <button id="next-q" style="display:none;">Next word →</button>`;

    quizBody.querySelectorAll(".option").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (selected) return;
        selected = btn.dataset.id;
        const isCorrect = selected === q.entry.id;
        if (isCorrect) score++; else missed.push(q.entry);
        quizBody.querySelectorAll(".option").forEach((b) => {
          if (b.dataset.id === q.entry.id) b.classList.add("correct");
          else if (b.dataset.id === selected) b.classList.add("wrong");
        });
        const nextBtn = document.getElementById("next-q");
        nextBtn.style.display = "flex";
        nextBtn.textContent = qIndex + 1 >= questions.length ? "See results →" : "Next word →";
        nextBtn.onclick = () => {
          qIndex++;
          selected = null;
          if (qIndex >= questions.length) renderResults();
          else renderQuestion();
        };
      });
    });
  }

  function renderResults() {
    const pct = score / questions.length;
    const msg = pct === 1 ? "Fluent. You speak Flolosii's language."
      : pct >= 0.7 ? "Pretty solid — a few words still slipping past you."
      : "Time for a re-read of the collection.";
    quizBody.innerHTML = `
      <div class="quiz-center">
        <h2 class="score-h">${score} / ${questions.length}</h2>
        <p class="quiz-sub">${msg}</p>
        ${missed.length > 0 ? `
          <div class="missed-block">
            <p class="missed-label">WORDS TO REVIEW</p>
            ${missed.map((m) => `<div style="margin-bottom:10px;"><span class="missed-word">${esc(m.word)}</span><p class="missed-meaning">${esc(m.meaning)}</p></div>`).join("")}
          </div>` : ""}
        <div class="done-actions">
          <button class="btn" id="retry-btn">↺ Try again</button>
          <button class="btn btn-accent" id="done-btn">Done</button>
        </div>
      </div>`;
    document.getElementById("retry-btn").addEventListener("click", renderQuizIntro);
    document.getElementById("done-btn").addEventListener("click", () => quizOverlay.classList.remove("open"));
  }

  renderQuestion();
}
</script>
</body>
</html>
